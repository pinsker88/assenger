# ===== Rate limit zones (global http context) =====

# Requests per IP: 10 requests/second average with short bursts
limit_req_zone $binary_remote_addr zone=perip_rps:10m rate=10r/s;

# Lower TPS for expensive endpoints (e.g., /api) if you add them later
limit_req_zone $binary_remote_addr zone=perip_api:10m rate=5r/s;

# Concurrent connection limiting per IP
limit_conn_zone $binary_remote_addr zone=perip_conns:10m;

# Redirect HTTP -> HTTPS
server {
  listen 80;
  server_name assenger.co www.assenger.co;

  # Global per-IP request limit with small burst
  limit_req zone=perip_rps burst=20 nodelay;

  # Cap concurrent connections per IP
  limit_conn perip_conns 40;


  # ACME http-01 challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server
server {
  listen 443 ssl;
  server_name assenger.co www.assenger.co;

  # Cert paths (mounted from host/volume)
  ssl_certificate     /etc/letsencrypt/live/assenger.co/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/assenger.co/privkey.pem;

  # Reasonable TLS defaults
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # HSTS (enable after you verify HTTPS works)
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Global per-IP request limit with small burst
  limit_req zone=perip_rps burst=20 nodelay;

  # Cap concurrent connections per IP
  limit_conn perip_conns 10;

  # Static SPA
  root /usr/share/nginx/html;
  index index.html;

  error_page 429 = @ratelimited;
  location @ratelimited {
    return 429 "Too many requests. Please slow down.\n";
    add_header Content-Type text/plain;
  }
  
  location /ws {
    proxy_pass http://signal:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    access_log off;
    try_files $uri =404;
  }
}
