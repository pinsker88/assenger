# ---------- Identity ----------
realm=assenger.co
server-name=assenger.co
fingerprint

# ---------- Auth: Static user/password (TEST ONLY) ----------
lt-cred-mech
user=testuser:testpass     # <— this is what your browser uses

# ---------- Listeners ----------
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=PUBLIC_IP/172.18.0.3

# ---------- Relay Ports (match docker) ----------
min-port=50000
max-port=50050

# ---------- TLS ----------
cert=/etc/letsencrypt/live/assenger.co/fullchain.pem
pkey=/etc/letsencrypt/live/assenger.co/privkey.pem
no-sslv3
no-tlsv1
no-tlsv1_1

# ---------- Security ----------
no-multicast-peers
stale-nonce=600
check-origin-consistency
total-quota=0
user-quota=0

# ---------- Logging ----------
simple-log
