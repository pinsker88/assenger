version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue-nginx
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./webapp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s        # run every 30 seconds
      timeout: 5s          # wait max 5s for a response
      retries: 3           # mark unhealthy after 3 consecutive failures
      start_period: 10s    # give it time to boot before first check

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "sleep infinity"

  coturn:
    image: coturn/coturn
    container_name: coturn
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "50000-50050:50000-50050/udp"

volumes:
  certbot-www:
  letsencrypt: