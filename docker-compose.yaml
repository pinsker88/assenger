version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue-nginx
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./webapp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s        # run every 30 seconds
      timeout: 5s          # wait max 5s for a response
      retries: 3           # mark unhealthy after 3 consecutive failures
      start_period: 10s    # give it time to boot before first check

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "sleep infinity"

  # Spring Boot signaling server used for WebRTC offer/answer/ICE exchange. It
  # builds from the source in the signal-server directory and exposes port
  # 8080 internally. The web service proxies WebSocket traffic to this
  # container via nginx using an upstream location block (see nginx.conf). It
  # uses the same restart policy as the web container.
  signal:
    build:
      context: signal-server
      dockerfile: Dockerfile
    container_name: signal-server
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  certbot-www:
  letsencrypt: