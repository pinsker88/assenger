# Redirect HTTP -> HTTPS
server {
  listen 80;
  server_name assenger.co www.assenger.co;

  # ACME http-01 challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server
server {
  listen 443 ssl;
  server_name assenger.co www.assenger.co;

  # Cert paths (mounted from host/volume)
  ssl_certificate     /etc/letsencrypt/live/assenger.co/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/assenger.co/privkey.pem;

  # Reasonable TLS defaults
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # HSTS (enable after you verify HTTPS works)
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Static SPA
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    access_log off;
    try_files $uri =404;
  }
}
